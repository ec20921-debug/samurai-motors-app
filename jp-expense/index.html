<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e2e0db; --accent:#b3121b; --ok:#1f7a3a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { background:#111; color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:17px; }
  header p { margin:2px 0 0; font-size:13px; color:#bbb; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  .req { color:var(--accent); font-weight:400; font-size:12px; margin-left:4px; }
  input, select, textarea { width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .row > .cur { flex:0 0 96px; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:16px; text-align:center; color:var(--sub); font-size:14px; cursor:pointer; }
  .drop.over { border-color:var(--accent); background:#fff6f6; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .thumb { position:relative; width:76px; height:76px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#fafafa; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub); }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb button { position:absolute; top:2px; right:2px; width:22px; height:22px; border:0; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:13px; line-height:22px; padding:0; cursor:pointer; }
  .submit { width:100%; margin-top:18px; padding:14px; font-size:17px; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  .submit:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:12px; font-size:14px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--accent); }
  h2 { font-size:15px; margin:0 0 8px; }
  ul.recent { list-style:none; margin:0; padding:0; font-size:14px; }
  ul.recent li { padding:8px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; }
  ul.recent li:first-child { border-top:0; }
  ul.recent .d { color:var(--sub); font-size:12px; }
  .empty { color:var(--sub); font-size:14px; }
  .hint { color:var(--sub); font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>日本側経費の入力</h1>
  <p id="who">読み込み中…</p>
</header>
<main>
  <div id="bad" class="card" style="display:none">
    このリンクでは入力できません。鈴木に正しいリンクを確認してください。
  </div>

  <form id="f" class="card" style="display:none" autocomplete="off">
    <label>日付<span class="req">必須</span></label>
    <input type="date" id="date" required>

    <label>何に使ったか<span class="req">必須</span></label>
    <input type="text" id="item" placeholder="例: 名刺の印刷（Canva）" required>

    <label>金額<span class="req">必須</span></label>
    <div class="row">
      <input type="number" id="amount" inputmode="decimal" step="any" min="0" placeholder="例: 10100" required>
      <select id="currency" class="cur"></select>
    </div>

    <label>分類<span class="req">必須</span></label>
    <select id="category" required></select>

    <label>支払い方法<span class="req">必須</span></label>
    <select id="method" required></select>

    <label>スクショ・レシート（5枚まで）</label>
    <div id="drop" class="drop">ここを押して選ぶ（またはドラッグ）<br><span class="hint">写真・スクショ・PDF</span></div>
    <input type="file" id="file" accept="image/*,application/pdf" multiple style="display:none">
    <div id="thumbs" class="thumbs"></div>

    <label>コメント</label>
    <textarea id="comment" placeholder="例: Hiro さんと鈴木の名刺。パンフは三つ折り100部"></textarea>

    <button type="submit" id="send" class="submit">登録する</button>
    <div id="msg" class="msg"></div>
  </form>

  <div id="recentCard" class="card" style="display:none">
    <h2>最近あなたが入れた経費</h2>
    <ul id="recent" class="recent"></ul>
  </div>
</main>

<script>
  var K = <?= JSON.stringify(k) ?>;
  var files = []; // {name, mime, data, preview}
  var reqId = null; // 送信ID（失敗して送り直しても同じIDを使う＝二重登録を防ぐ）
  var $ = function (id) { return document.getElementById(id); };

  function today() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fill(sel, list, value) {
    sel.innerHTML = '';
    list.forEach(function (v) { var o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
    if (value) sel.value = value;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function showRecent(list) {
    $('recentCard').style.display = '';
    if (!list || !list.length) { $('recent').innerHTML = '<li class="empty">まだありません</li>'; return; }
    $('recent').innerHTML = list.map(function (r) {
      return '<li><span>' + esc(r.item) + '<br><span class="d">' + esc(r.date) + '・' + esc(r.category) + '</span></span>' +
             '<span>' + esc(r.amount) + ' ' + esc(r.currency) + '</span></li>';
    }).join('');
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.ok) { $('who').textContent = ''; $('bad').style.display = ''; return; }
      $('who').textContent = res.name + ' さん（負担した人として記録されます）';
      fill($('category'), res.categories, '広告宣伝費');
      fill($('currency'), res.currencies, 'JPY');
      fill($('method'), res.methods, 'クレカ');
      $('date').value = today();
      $('f').style.display = '';
      showRecent(res.recent);
    })
    .withFailureHandler(function (e) { $('who').textContent = ''; $('bad').style.display = ''; $('bad').textContent = '読み込みに失敗しました: ' + e.message; })
    .jpInit(K);

  // ── 証憑の選択 ──
  $('drop').onclick = function () { $('file').click(); };
  $('file').onchange = function () { addFiles(this.files); this.value = ''; };
  ['dragover', 'dragenter'].forEach(function (ev) { $('drop').addEventListener(ev, function (e) { e.preventDefault(); $('drop').classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { $('drop').addEventListener(ev, function () { $('drop').classList.remove('over'); }); });
  $('drop').addEventListener('drop', function (e) { e.preventDefault(); addFiles(e.dataTransfer.files); });
  // スクショをそのまま貼り付け（PC）
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.files) || [];
    if (items.length) addFiles(items);
  });

  function addFiles(list) {
    Array.prototype.slice.call(list).forEach(function (f) {
      if (files.length >= 5) return;
      if (f.type === 'application/pdf') {
        if (f.size > 4 * 1024 * 1024) { alert('PDF は 4MB までです'); return; }
        var r = new FileReader();
        r.onload = function () { files.push({ name: f.name, mime: f.type, data: String(r.result).split(',')[1], preview: null }); drawThumbs(); };
        r.readAsDataURL(f);
      } else if (f.type.indexOf('image/') === 0 || /\.(heic|heif)$/i.test(f.name)) {
        shrink(f, function (dataUrl) { files.push({ name: f.name, mime: 'image/jpeg', data: dataUrl.split(',')[1], preview: dataUrl }); drawThumbs(); });
      }
    });
  }
  // 長い辺 1600px の JPEG に縮める（送る時間を短くする）
  function shrink(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1600, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert('この画像は読み込めませんでした: ' + file.name); };
    img.src = url;
  }
  function drawThumbs() {
    $('thumbs').innerHTML = '';
    files.forEach(function (f, i) {
      var d = document.createElement('div'); d.className = 'thumb';
      d.innerHTML = f.preview ? '<img src="' + f.preview + '">' : 'PDF';
      var b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.title = '外す';
      b.onclick = function () { files.splice(i, 1); drawThumbs(); };
      d.appendChild(b); $('thumbs').appendChild(d);
    });
  }

  // ── 登録 ──
  $('f').onsubmit = function (e) {
    e.preventDefault();
    var msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
    if (!files.length && !confirm('スクショ・レシートがありません。このまま登録しますか？')) return;
    var size = files.reduce(function (a, f) { return a + f.data.length; }, 0);
    if (size > 9 * 1024 * 1024) { msg.className = 'msg err'; msg.textContent = 'ファイルの合計が大きすぎます（合計 6MB まで）。枚数を減らしてください'; return; }
    if (!reqId) reqId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    var p = {
      reqId: reqId,
      date: $('date').value, item: $('item').value, amount: $('amount').value, currency: $('currency').value,
      category: $('category').value, method: $('method').value, comment: $('comment').value,
      files: files.map(function (f) { return { name: f.name, mime: f.mime, data: f.data }; })
    };
    $('send').disabled = true; $('send').textContent = '送っています…';
    google.script.run
      .withSuccessHandler(function (res) {
        $('send').disabled = false; $('send').textContent = '登録する';
        if (!res || !res.ok) { msg.className = 'msg err'; msg.textContent = (res && res.error) || '登録できませんでした'; return; }
        msg.className = 'msg ok';
        msg.textContent = '登録しました（経費マスター ' + res.row + ' 行目）。続けて入れられます。';
        reqId = null;
        $('item').value = ''; $('amount').value = ''; $('comment').value = '';
        files = []; drawThumbs();
        showRecent(res.recent);
      })
      .withFailureHandler(function (err) {
        $('send').disabled = false; $('send').textContent = '登録する';
        msg.className = 'msg err'; msg.textContent = '登録できませんでした: ' + err.message;
      })
      .jpSubmit(K, p);
  };
</script>
</body>
</html>
